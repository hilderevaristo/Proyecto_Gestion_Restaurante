<div class="offcanvas offcanvas-end" tabindex="-1" id="carritoOffcanvas" style="width: 400px;">
  <div class="offcanvas-header border-bottom">
    <h5 class="offcanvas-title">
      <i class="fas fa-shopping-cart me-2"></i>Tu pedido
    </h5>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
  </div>

  <div class="offcanvas-body">
    @if (carrito.carrito().length === 0) {
      <div class="text-center text-muted py-5">
        <i class="fas fa-shopping-basket fa-3x mb-3"></i>
        <p>Tu carrito está vacío</p>
      </div>
    }

    @for (item of carrito.carrito(); track item.id) {
      <div class="d-flex mb-3 align-items-center border-bottom pb-3">
        <img [src]="item.imagen" [alt]="item.nombre"
             style="width: 60px; height: 60px; object-fit: cover;" class="rounded me-3">

        <div class="flex-grow-1">
          <h6 class="mb-1">{{ item.nombre }}</h6>
          <small class="text-danger fw-bold">S/ {{ item.precio | number:'1.2-2' }}</small>

          <div class="d-flex align-items-center gap-2 mt-1">
            <button class="btn btn-sm btn-outline-secondary" (click)="cambiar(item.id, item.cantidad - 1)">−</button>
            <span>{{ item.cantidad }}</span>
            <button class="btn btn-sm btn-outline-secondary" (click)="cambiar(item.id, item.cantidad + 1)">+</button>
            <button class="btn btn-sm btn-link text-danger ms-auto" (click)="quitar(item.id)">
              <i class="fas fa-trash"></i>
            </button>
          </div>
        </div>
      </div>
    }
  </div>

  @if (carrito.carrito().length > 0) {
    <div class="border-top p-3">
      <div class="d-flex justify-content-between mb-2">
        <strong>Total:</strong>
        <strong class="text-danger">S/ {{ carrito.total() | number:'1.2-2' }}</strong>
      </div>
      <button class="btn btn-danger w-100" (click)="finalizarCompra()">
        Finalizar pedido
      </button>
    </div>
  }
</div>
