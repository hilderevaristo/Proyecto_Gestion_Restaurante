<section class="container my-5 py-5 bg-light rounded-4">
  <div class="text-center mb-5">
    <h2 class="fw-bold text-danger">Lo que dicen nuestros clientes</h2>
    <div class="divider bg-danger mx-auto my-3" style="width: 60px; height: 3px;"></div>
    <p class="text-muted">Opiniones reales de quienes disfrutan nuestra tradición</p>
  </div>

  <div class="row g-4">
    @for (t of testimonios; track t.usuario) {
      <div class="col-md-6 col-lg-4">
        <div class="card h-100 border-0 shadow-sm">
          <div class="card-body">
            <div class="mb-3">
              <i class="fas fa-quote-left fa-2x text-danger opacity-50"></i>
            </div>
            <p class="card-text">"{{ t.texto }}"</p>
            <div class="mt-3">
              <h6 class="fw-bold mb-0">{{ t.nombre }}</h6>
              <small class="text-muted">{{ t.usuario }}</small>
              <div class="text-warning mt-1">
                @for (i of [1,2,3,4,5]; track i) {
                  @if (i <= t.estrellas) {
                    <i class="fas fa-star"></i>
                  } @else {
                    <i class="far fa-star"></i>
                  }
                }
              </div>
            </div>
          </div>
        </div>
      </div>
    }
  </div>
</section>
